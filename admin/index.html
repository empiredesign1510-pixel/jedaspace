<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#0b57d0" />
  <title>JEDA Space — Order at Your Table</title>
  <style>
    :root{
      --ink:#171713;--muted:#6f7068;--paper:#f4f1e8;--card:#fffdf7;--line:#ded8ca;
      --accent:#ffc928;--accent2:#fff4c2;--brown:#5f4636;--danger:#b42318;--warn:#b54708;
      --shadow:0 18px 50px rgba(33,33,25,.08);--radius:26px;--radius-sm:16px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .shell{width:min(1180px,calc(100% - 28px));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid rgba(86,82,72,.11)}
    .topbar-in{height:74px;display:flex;align-items:center;gap:18px;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
    .brand-mark{width:40px;height:40px;border-radius:13px;background:#11110f;color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.08em;overflow:hidden;flex:0 0 auto}
    .brand-mark img{width:100%;height:100%;object-fit:cover}
    .brand-copy b{display:block;font-size:17px;line-height:1}.brand-copy span{display:block;color:var(--muted);font-size:11px;margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
    .table-pill,.status-pill,.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.42);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:700}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(189,255,99,.18)}
    .hero{padding:46px 0 28px}.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}
    .hero-card{border-radius:34px;background:#11110f;color:#fff;padding:40px;min-height:360px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
    .hero-card:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-120px;bottom:-170px;background:radial-gradient(circle at 30% 30%,var(--accent),rgba(189,255,99,.05) 60%,transparent 65%);opacity:.9}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#c8c8bf;font-weight:800}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.06em;margin:18px 0 20px;max-width:740px}.hero p{max-width:620px;color:#c8c8bf;line-height:1.7;font-size:15px}
    .hero-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.hero-badge{font-size:12px;padding:10px 12px;border-radius:999px;background:#262620;border:1px solid #3b3b33;color:#f3f0e8}
    .mini-panel{background:var(--card);border:1px solid var(--line);border-radius:34px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
    .mini-panel .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}.mini-panel .big{font-size:30px;line-height:1.1;font-weight:850;letter-spacing:-.04em;margin:12px 0}.mini-panel .note{color:var(--muted);font-size:13px;line-height:1.6}
    .order-trace{display:grid;gap:10px;margin-top:24px}.trace-row{display:flex;gap:11px;align-items:center;font-size:13px}.trace-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#efebdf;border:1px solid var(--line);font-weight:800}.trace-row.active .trace-no{background:var(--accent);border-color:var(--accent)}
    .section{padding:28px 0 100px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.section-head h2{font-size:32px;letter-spacing:-.04em;margin:0}.section-head p{margin:7px 0 0;color:var(--muted);font-size:14px}
    .category-row{display:flex;gap:9px;overflow:auto;padding:3px 0 14px;scrollbar-width:none}.category-row::-webkit-scrollbar{display:none}.category-btn{white-space:nowrap;padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:750;color:#56564f}.category-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.menu-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;min-height:250px;transition:.22s transform,.22s box-shadow}.menu-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .menu-visual{height:112px;border-radius:18px;background:linear-gradient(135deg,#27241f,#65513f);position:relative;overflow:hidden;padding:16px;color:#fff;display:flex;align-items:flex-end}.menu-visual:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-20px;top:-20px;background:var(--accent);opacity:.88}.menu-visual[data-cat="Non Coffee"]{background:linear-gradient(135deg,#4d5240,#89936a)}.menu-visual[data-cat="Food"]{background:linear-gradient(135deg,#6f4d36,#b9865f)}.menu-visual[data-cat="Snack"]{background:linear-gradient(135deg,#5f5d4a,#afa67d)}
    .menu-visual span{position:relative;z-index:2;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:800;opacity:.85}.menu-body{padding-top:16px}.menu-top{display:flex;justify-content:space-between;gap:12px}.menu-name{font-size:18px;font-weight:850;line-height:1.15}.menu-price{font-size:15px;font-weight:850;white-space:nowrap}.menu-desc{color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0 14px;min-height:38px}.menu-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}.stock{font-size:11px;color:var(--muted)}
    .btn{border:0;border-radius:14px;padding:11px 14px;background:var(--ink);color:#fff;font-weight:800}.btn:hover{filter:brightness(1.08)}.btn.accent{background:var(--accent);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0ed;color:var(--danger);border:1px solid #ffd4cc}.btn.sm{padding:8px 10px;font-size:12px;border-radius:11px}
    .cart-fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border:0;border-radius:18px;padding:13px 15px 13px 16px;box-shadow:0 20px 55px rgba(0,0,0,.22)}.cart-fab .count{min-width:27px;height:27px;border-radius:9px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:900}.cart-fab small{display:block;color:#bdbdb2;font-weight:650;text-align:left}.cart-fab strong{display:block;text-align:left}
    .drawer-backdrop{position:fixed;inset:0;background:rgba(17,17,15,.46);z-index:70;opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;height:100%;width:min(460px,100%);background:var(--paper);padding:22px;overflow:auto;transform:translateX(100%);transition:.25s}.drawer-backdrop.open .drawer{transform:translateX(0)}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer-head h3{font-size:28px;letter-spacing:-.04em;margin:0}.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:900}
    .cart-line{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.cart-line h4{margin:0 0 6px}.cart-line small{color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
    .summary{margin-top:18px;padding:16px;border:1px solid var(--line);background:var(--card);border-radius:18px}.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0}.sumrow.total{font-size:17px;font-weight:900;border-top:1px dashed var(--line);margin-top:8px;padding-top:13px}
    .field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800;color:#505048}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#93947e;box-shadow:0 0 0 3px rgba(189,255,99,.22)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(10,10,9,.56);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:28px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.35)}.modal h3{font-size:29px;letter-spacing:-.04em;margin:0 0 8px}.modal p{color:var(--muted);font-size:13px;line-height:1.55}.qr-box{background:#fff;border-radius:22px;padding:18px;margin:16px auto;width:min(300px,100%);aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line)}.qr-box img{max-width:100%;max-height:100%;object-fit:contain}.qr-demo{display:grid;grid-template-columns:repeat(11,1fr);width:100%;height:100%;gap:2px;padding:8px}.qr-demo i{background:#fff}.qr-demo i.on{background:#111}
    .order-banner{margin:0 auto 25px;background:var(--accent2);border:1px solid #cde898;border-radius:22px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.order-banner strong{font-size:16px}.order-banner p{font-size:12px;color:#5d644d;margin:5px 0 0}
    .rating{display:flex;gap:6px;font-size:26px}.star{border:0;background:transparent;padding:2px;filter:grayscale(1);opacity:.45}.star.on,.star:hover{filter:none;opacity:1}
    /* admin */
    .admin{background:#efede7;min-height:100vh}.admin-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#12120f;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.side-brand{padding:7px 8px 26px;border-bottom:1px solid #2a2a24}.side-brand h2{margin:0;font-size:23px}.side-brand span{display:block;color:#919188;font-size:11px;margin-top:5px;text-transform:uppercase;letter-spacing:.13em}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:#aaa99f;padding:12px 12px;border-radius:12px;text-align:left;font-weight:750}.nav button.active,.nav button:hover{background:#24241f;color:#fff}.side-bottom{position:absolute;bottom:24px;left:18px;right:18px}.admin-main{padding:26px}.admin-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.admin-head h1{font-size:34px;letter-spacing:-.05em;margin:0}.admin-head p{color:var(--muted);font-size:13px;margin:5px 0 0}.admin-actions{display:flex;gap:8px;align-items:center}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{padding:18px;background:#fff;border:1px solid #dcd8cd;border-radius:20px}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}.metric strong{display:block;font-size:28px;letter-spacing:-.04em;margin-top:8px}.metric small{color:var(--muted)}
    .panel{background:#fff;border:1px solid #dcd8cd;border-radius:22px;padding:18px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-title h3{margin:0;font-size:20px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid #e7e3da}.data-table td{font-size:12px;padding:12px 10px;border-bottom:1px solid #eeeae1;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.badge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;display:inline-flex}.badge.new{background:#fff2cf;color:#8a5b00}.badge.paid{background:#e8f4ff;color:#175c96}.badge.process{background:#f0e9ff;color:#6842a5}.badge.done{background:#e7f8e8;color:#22722b}.badge.cancel{background:#ffe8e5;color:#9b2e24}
    .admin-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.editor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.file-drop{border:1px dashed #bbb5a9;border-radius:15px;padding:16px;text-align:center;color:var(--muted);font-size:12px;background:#faf8f2}.file-drop img{max-width:160px;max-height:160px;display:block;margin:10px auto;border-radius:12px}.login-wrap{min-height:100vh;display:grid;place-items:center;background:#11110f;padding:18px}.login-card{width:min(430px,100%);background:var(--paper);padding:30px;border-radius:28px}.login-card h1{font-size:38px;margin:10px 0 8px;letter-spacing:-.05em}.login-card p{color:var(--muted);line-height:1.6;font-size:13px}.error{color:var(--danger);font-size:12px;font-weight:700}
    .toast-stack{position:fixed;right:18px;top:88px;z-index:200;display:grid;gap:8px}.toast{background:#111;color:#fff;padding:12px 14px;border-radius:13px;box-shadow:var(--shadow);font-size:12px;animation:toastIn .25s ease}.toast b{color:var(--accent)}@keyframes toastIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
    @media(max-width:900px){.hero-grid,.admin-grid,.settings-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.admin-shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.side-bottom{position:static;margin-top:20px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.hero-card{min-height:330px}}
    @media(max-width:560px){.shell{width:min(100% - 18px,1180px)}.topbar-in{height:66px}.brand-copy span{display:none}.hero{padding-top:20px}.hero-card{padding:28px 22px;border-radius:26px}.hero h1{font-size:48px}.mini-panel{border-radius:26px}.menu-grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.admin-main{padding:16px}.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:22px}.editor-grid{grid-template-columns:1fr}.cart-fab{left:12px;right:12px;bottom:12px;justify-content:space-between}.order-banner{align-items:flex-start;flex-direction:column}}


    /* ===== JEDA customer storefront — mobile-first menu UI ===== */
    #customerApp{background:#fff;color:#171717;min-height:100vh;--jeda-yellow:#ffc928;--jeda-black:#101010;--jeda-soft:#f6f6f4;--jeda-line:#ececea}

    .customer-head-in{padding:17px 0 14px}
    .customer-brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}
    .customer-brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0}
    .customer-brand-logo{width:48px;height:48px;border-radius:15px;overflow:hidden;background:#000;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.09);flex:0 0 auto}

    .customer-filter-row{display:flex;gap:10px;align-items:center;margin-top:18px;min-width:0}

    .round-filter svg{width:21px;height:21px}

    #customerApp .category-btn.active{background:#111;color:#fff;border-color:#111;box-shadow:none}.category-btn.active:after{content:"";display:inline-block;width:6px;height:6px;background:var(--jeda-yellow);border-radius:50%;margin-left:8px;vertical-align:1px}
    .search-box{display:grid;grid-template-columns:1fr 38px;align-items:center;gap:5px;max-height:0;opacity:0;overflow:hidden;transition:.22s ease;margin-top:0}.search-box.open{max-height:58px;opacity:1;margin-top:12px}

    .search-box button{width:38px;height:38px;border:0;background:#f1f1ef;border-radius:11px;font-size:19px;color:#555}
    .customer-menu-area{padding:23px 0 112px}.customer-menu-area .shell{width:min(100%,920px)}
    #customerApp .order-banner{margin:0 20px 22px;background:#fff8df;border:1px solid #f2d97c;border-radius:17px;padding:15px 16px;box-shadow:none}

    .recommend-section{padding:0 20px 26px;border-bottom:11px solid #f6f6f4}

    .recommend-card{width:min(83vw,390px);min-width:min(83vw,390px);min-height:156px;border:1px solid #e4e4e1;border-radius:17px;background:#fff;box-shadow:0 5px 15px rgba(0,0,0,.055);padding:13px;display:grid;grid-template-columns:118px 1fr;gap:14px;position:relative;scroll-snap-align:start}

  function addCart(id){const m=state.menu.find(x=>x.id===id);if(!m||m.stock<1)return;const q=state.cart[id]||0;if(q>=m.stock)return toast('Stok maksimum tercapai.');state.cart[id]=q+1;persist();renderCart();toast(m.name,'Ditambahkan');}
  function cartInfo(){const lines=Object.entries(state.cart).map(([id,qty])=>({m:state.menu.find(x=>x.id===id),qty})).filter(x=>x.m&&x.qty>0);const subtotal=lines.reduce((a,x)=>a+x.m.price*x.qty,0);const service=Math.round(subtotal*(+state.settings.service||0)/100);const tax=Math.round(subtotal*(+state.settings.tax||0)/100);return{lines,subtotal,service,tax,total:subtotal+service+tax};}

  function showPayment(o){

    const sync=()=>{

  function renderOrders(){const paid=state.orders.filter(o=>['paid','processing','ready'].includes(o.status)).length;const waiting=state.orders.filter(o=>o.status==='pending_payment').length;const revenue=state.orders.filter(o=>['paid','processing','ready','completed'].includes(o.status)).reduce((a,o)=>a+o.total,0);const done=state.orders.filter(o=>o.status==='completed').length;const rating=state.orders.filter(o=>o.rating).length?state.orders.filter(o=>o.rating).reduce((a,o)=>a+o.rating,0)/state.orders.filter(o=>o.rating).length:0;$('#adminContent').innerHTML=`<div class="admin-head"><div><h1>Orders</h1><p>Verifikasi pembayaran QRIS sebelum pesanan masuk ke proses bar / dapur.</p></div><div class="admin-actions"><button class="btn ghost" id="refreshOrders">Refresh</button></div></div><section class="metrics"><div class="metric"><span>Menunggu verifikasi</span><strong>${waiting}</strong><small>cek transaksi QRIS</small></div><div class="metric"><span>Active orders</span><strong>${paid}</strong><small>sudah terkonfirmasi</small></div><div class="metric"><span>Revenue</span><strong>${rupiah(revenue)}</strong><small>pembayaran valid</small></div><div class="metric"><span>Completed / Rating</span><strong>${done} / ${rating?rating.toFixed(1):'—'}</strong><small>operasional hari ini</small></div></section><section class="panel"><div class="panel-title"><h3>Order queue</h3><span class="chip">${state.orders.length} total</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Meja</th><th>Items</th><th>Total</th><th>Status</th><th>Waktu</th><th>Aksi</th></tr></thead><tbody>${state.orders.length?state.orders.map(o=>`<tr><td><b>${o.id}</b><br><small>${esc(o.note||'—')}</small></td><td>${esc(o.table)}</td><td>${o.items.reduce((a,x)=>a+x.qty,0)} item</td><td><b>${rupiah(o.total)}</b></td><td>${badgeStatus(o.status)}</td><td>${new Date(o.createdAt).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'})}</td><td>${o.status==='pending_payment'?`<button class="btn sm accent admin-pay-action" data-confirm-pay="${o.id}">Konfirmasi Bayar</button> <button class="btn sm danger" data-cancel-order="${o.id}">Batalkan</button>`:`<select data-status="${o.id}" style="padding:7px;border-radius:9px;border:1px solid #cbdcf1"><option value="paid" ${o.status==='paid'?'selected':''}>Paid</option><option value="processing" ${o.status==='processing'?'selected':''}>Processing</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="completed" ${o.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select>`} <button class="btn sm ghost" data-print="${o.id}">Print</button></td></tr>`).join(''):'<tr><td colspan="7" style="padding:30px;text-align:center;color:#777">Belum ada order.</td></tr>'}</tbody></table></div></section>`;

  function printReceipt(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const w=window.open('','_blank','width=420,height=680');w.document.write(`<!doctype html><html><head><title>${o.id}</title><style>body{font-family:monospace;padding:20px;color:#111}h2{text-align:center}.row{display:flex;justify-content:space-between;margin:6px 0}.dash{border-top:1px dashed #111;margin:12px 0}small{display:block;text-align:center;margin-top:20px}</style></head><body><h2>JEDA SPACE</h2><div style="text-align:center">Order ${o.id}<br>Meja ${esc(o.table)}<br>${new Date(o.createdAt).toLocaleString('id-ID')}</div><div class="dash"></div>${o.items.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><span>${rupiah(i.price*i.qty)}</span></div>`).join('')}<div class="dash"></div><div class="row"><b>TOTAL</b><b>${rupiah(o.total)}</b></div><div class="dash"></div><small>Terima kasih sudah mengambil jeda.</small><script>window.print()<\/script></body></html>`);w.document.close();}
  function renderMenuAdmin(){
    $('#adminContent').innerHTML=`<div class="admin-head"><div><h1>Menu & Inventory</h1><p>Edit produk, kategori, harga, stok, dan status tampil.</p></div><button class="btn accent" id="addMenuBtn">+ Menu baru</button></div><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Menu</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${state.menu.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small>${esc(m.desc||'')}</small></td><td>${m.cat}</td><td>${rupiah(m.price)}</td><td>${m.stock}</td><td><span class="badge ${m.active?'done':'cancel'}">${m.active?'Active':'Hidden'}</span></td><td><button class="btn sm ghost" data-edit="${m.id}">Edit</button> <button class="btn sm danger" data-del="${m.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div></section>`;
    $('#addMenuBtn').onclick=()=>menuEditor();$$('[data-edit]').forEach(b=>b.onclick=()=>menuEditor(b.dataset.edit));$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Hapus menu ini?')){state.menu=state.menu.filter(m=>m.id!==b.dataset.del);persist();renderMenuAdmin()}});
  }
  function menuEditor(id){
    const m=state.menu.find(x=>x.id===id)||{id:'m'+Date.now(),name:'',cat:'Coffee',price:0,stock:0,active:true,desc:'',image:''};
    let pendingImg=m.image||'';
    $('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>${id?'Edit menu':'Menu baru'}</h3><div class="editor-grid"><div class="field"><label>Nama</label><input id="mName" value="${attr(m.name)}"></div><div class="field"><label>Kategori</label><select id="mCat"><option ${m.cat==='Coffee'?'selected':''}>Coffee</option><option ${m.cat==='Non Coffee'?'selected':''}>Non Coffee</option><option ${m.cat==='Food'?'selected':''}>Food</option><option ${m.cat==='Snack'?'selected':''}>Snack</option></select></div><div class="field"><label>Harga</label><input id="mPrice" type="number" min="0" value="${m.price}"></div><div class="field"><label>Stok</label><input id="mStock" type="number" min="0" value="${m.stock}"></div></div><div class="field"><label>Deskripsi</label><textarea id="mDesc" rows="3">${esc(m.desc||'')}</textarea></div><div class="field"><label>Foto menu</label><div class="file-drop"><input type="file" id="mImage" accept="image/*"><div>Upload foto produk agar tampil di halaman pelanggan</div>${pendingImg?`<img src="${pendingImg}" alt="Preview menu">`:''}</div></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="mActive" ${m.active?'checked':''}> Tampilkan di menu pelanggan</label><div style="display:flex;gap:8px;margin-top:18px"><button class="btn accent" style="flex:1" id="saveMenu">Simpan</button><button class="btn ghost" id="cancelMenu">Batal</button></div></div></div>`;
    $('#mImage').onchange=e=>fileToData(e.target.files[0],x=>{pendingImg=x;const img=$('#mImage').closest('.file-drop').querySelector('img');if(img)img.src=x;else $('#mImage').closest('.file-drop').insertAdjacentHTML('beforeend',`<img src="${x}" alt="Preview menu">`)});
    $('#saveMenu').onclick=()=>{m.name=$('#mName').value.trim();m.cat=$('#mCat').value;m.price=+$('#mPrice').value;m.stock=+$('#mStock').value;m.desc=$('#mDesc').value.trim();m.active=$('#mActive').checked;m.image=pendingImg;if(!m.name)return toast('Nama menu wajib diisi.');if(!id)state.menu.push(m);persist();$('#modalRoot').innerHTML='';renderMenuAdmin();toast('Menu berhasil disimpan.')};
    $('#cancelMenu').onclick=()=>$('#modalRoot').innerHTML='';
  }
  function renderSettings(){
    $('#adminContent').innerHTML=`<div class="admin-head"><div><h1>QRIS & Settings</h1><p>Atur pembayaran, brand, biaya, rating, dan password dashboard.</p></div></div><div class="settings-grid"><section class="panel"><div class="panel-title"><h3>Payment & Brand</h3></div><div class="field"><label>Nama outlet</label><input id="setStore" value="${attr(state.settings.storeName)}"></div><div class="editor-grid"><div class="field"><label>Service (%)</label><input id="setService" type="number" min="0" max="100" value="${state.settings.service}"></div><div class="field"><label>Pajak (%)</label><input id="setTax" type="number" min="0" max="100" value="${state.settings.tax}"></div></div><div class="field"><label>Link Google Maps untuk rating</label><input id="setGmaps" value="${attr(state.settings.gmaps)}" placeholder="https://g.page/r/..."></div><div class="field"><label>QRIS image</label><div class="file-drop"><input type="file" id="qrisUpload" accept="image/*"><div>Upload PNG/JPG QRIS merchant</div>${state.settings.qris?`<img src="${state.settings.qris}" alt="QRIS preview">`:''}</div></div><div class="field"><label>Logo JEDA</label><div class="file-drop"><input type="file" id="logoUpload" accept="image/*"><div>Upload logo agar muncul di header pelanggan</div>${state.settings.logo?`<img src="${state.settings.logo}" alt="Logo preview">`:''}</div></div><button class="btn accent" id="saveSettings">Simpan settings</button></section><section class="panel"><div class="panel-title"><h3>Admin & QR meja</h3></div><div class="field"><label>Password admin baru</label><input id="setPass" type="password" value="${attr(state.settings.adminPassword)}"></div><button class="btn" id="savePass">Update password</button><div style="height:1px;background:#eee8dd;margin:22px 0"></div><div class="field"><label>Buat link QR meja</label><input id="tableNo" placeholder="Contoh: 07"></div><button class="btn ghost" id="makeTableLink">Generate link</button><div id="tableLinkOut" style="margin-top:12px"></div><p style="font-size:11px;color:var(--muted);margin-top:20px">Format pelanggan: <b>?table=07</b>. Pada paket GitHub yang disertakan, halaman admin tersedia di folder <b>/admin/</b>. Data demo memakai localStorage pada browser yang sama.</p></section></div>`;
    let pendingQ=state.settings.qris,pendingL=state.settings.logo;$('#qrisUpload').onchange=e=>fileToData(e.target.files[0],x=>pendingQ=x);$('#logoUpload').onchange=e=>fileToData(e.target.files[0],x=>pendingL=x);$('#saveSettings').onclick=()=>{state.settings.storeName=$('#setStore').value.trim()||'JEDA Space';state.settings.service=+$('#setService').value||0;state.settings.tax=+$('#setTax').value||0;state.settings.gmaps=$('#setGmaps').value.trim();state.settings.qris=pendingQ;state.settings.logo=pendingL;persist();toast('Settings tersimpan.');renderSettings()};$('#savePass').onclick=()=>{if($('#setPass').value.length<4)return toast('Password minimal 4 karakter.');state.settings.adminPassword=$('#setPass').value;persist();toast('Password admin diperbarui.')};$('#makeTableLink').onclick=()=>{const t=$('#tableNo').value.trim();if(!t)return;const base=location.href.split('?')[0].split('#')[0].replace(/\/admin\/?$/,'/');const link=base+'?table='+encodeURIComponent(t);$('#tableLinkOut').innerHTML=`<div class="file-drop"><b>Meja ${esc(t)}</b><div style="word-break:break-all;margin-top:8px">${esc(link)}</div><button class="btn sm accent" style="margin-top:10px" id="copyTableLink">Copy link</button></div>`;$('#copyTableLink').onclick=()=>navigator.clipboard?.writeText(link).then(()=>toast('Link meja disalin.'))};
  }
  function fileToData(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
  function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function attr(v=''){return esc(v)}

  window.addEventListener('storage',e=>{if(e.key===STORAGE.orders){state.orders=JSON.parse(e.newValue||'[]');if(!isAdmin)renderCurrentOrder();else if(state.adminTab==='orders'){toast('Ada perubahan pesanan.','Update');renderOrders();}}});
  if(isAdmin)admin();else customer();
})();
</script>
</body>
</html>
