<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <title>JedaSpace — Self Order</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="setupBanner" class="setup-banner hidden">Firebase belum dikonfigurasi. Buka <strong>SETUP-HP.txt</strong>.</div>
  <main id="customerApp" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-logo" src="assets/logo.png" alt="Logo JedaSpace">
          <div class="brand-copy"><strong id="brandName">JedaSpace</strong><span>Self Ordering</span></div>
        </div>
        <div class="top-actions">
          <span id="tableChip" class="table-chip">Validasi meja...</span>
          <span class="status-chip"><span class="status-dot"></span>Buka</span>
        </div>
      </div>
    </header>

    <div id="customerState" class="container">
      <section class="state-card">
        <div class="skeleton" style="height:44px;width:72%;margin:0 auto 12px"></div>
        <div class="skeleton" style="height:18px;width:92%;margin:0 auto 8px"></div>
        <div class="skeleton" style="height:18px;width:64%;margin:0 auto"></div>
      </section>
    </div>
  </main>

  <div id="productOverlay" class="overlay modal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="productTitle">
      <div class="sheet-head">
        <div><h3 id="productTitle">Detail menu</h3><div id="productPrice" class="muted small"></div></div>
        <button id="closeProduct" class="icon-btn" aria-label="Tutup">✕</button>
      </div>
      <div id="productOptions"></div>
      <div class="form-group">
        <label>Catatan untuk item ini</label>
        <textarea id="itemNote" class="textarea" placeholder="Contoh: es sedikit, tanpa sedotan"></textarea>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0">
        <div class="qty-control">
          <button id="qtyMinus" type="button">−</button><span id="qtyValue">1</span><button id="qtyPlus" type="button">+</button>
        </div>
        <strong id="productTotal">Rp0</strong>
      </div>
      <button id="addConfiguredItem" class="btn btn-primary btn-block">Tambah ke keranjang</button>
    </div>
  </div>

  <div id="cartOverlay" class="overlay" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head"><div><h3>Keranjang</h3><div id="cartTableInfo" class="muted small"></div></div><button id="closeCart" class="icon-btn">✕</button></div>
      <div id="cartItems"></div>
      <div class="form-group" style="margin-top:14px"><label>Catatan pesanan</label><textarea id="orderNote" class="textarea" placeholder="Catatan untuk seluruh pesanan"></textarea></div>
      <div id="cartSummary" class="summary"></div>
      <div class="payment-note" style="margin:12px 0">Pembayaran MVP dilakukan di kasir. Status pembayaran akan diperbarui oleh barista/admin.</div>
      <button id="checkoutBtn" class="btn btn-primary btn-block">Kirim pesanan</button>
    </div>
  </div>

  <div id="statusOverlay" class="overlay modal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head"><div><h3 id="statusOrderNumber">Pesanan</h3><div id="statusTable" class="muted small"></div></div><button id="closeStatus" class="icon-btn">✕</button></div>
      <div id="paymentStatusBox" class="payment-note"></div>
      <div id="statusTimeline" class="status-timeline"></div>
      <div id="statusItems" class="summary"></div>
      <div id="statusCancelReason" class="payment-note hidden" style="margin-top:12px"></div>
      <button id="newOrderBtn" class="btn btn-secondary btn-block" style="margin-top:14px">Tambah pesanan</button>
    </div>
  </div>

  <script type="module" src="js/customer.js"></script>
</body>
</html>
